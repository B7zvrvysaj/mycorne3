name: Build ZMK Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      config-dir: config  # Папка с corne.conf и corne.keymap
      boards: '["nice_nano_v2"]'  # Плата
      shields: '["corne_left", "corne_right"]'  # Обе половины Corne
      artifact-name: corne-firmware  # Имя артефакта
    secrets: inherit